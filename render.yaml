# Render Blueprint — Devine Adventure
# Docs: https://render.com/docs/blueprint-spec
#
# Prod database: Supabase Postgres (set DATABASE_URL + DIRECT_URL in the dashboard).
# After first deploy, set FRONTEND_URL / NEXT_PUBLIC_API_URL to the live service URLs.
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo → apply.

services:
  # ── NestJS API ───────────────────────────────────────────
  - type: web
    name: devine-adventure-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: devine-adventure-api
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # Supabase pooler URL (port 6543, ?pgbouncer=true) — runtime
      - key: DATABASE_URL
        sync: false
      # Supabase direct URL (port 5432) — prisma migrate
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      # Set to https://<your-web-service>.onrender.com after web is live
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      # Optional integrations (leave blank if unused)
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MAILCHIMP_API_KEY
        sync: false
      - key: MAILCHIMP_SERVER_PREFIX
        sync: false
      - key: MAILCHIMP_LIST_ID
        sync: false

  # ── Next.js web ──────────────────────────────────────────
  - type: web
    name: devine-adventure-web
    runtime: node
    plan: starter
    region: oregon
    rootDir: devine-adventure-web
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
      # Must include /api/v1 — e.g. https://devine-adventure-api.onrender.com/api/v1
      # Required at BUILD time (Next inlines NEXT_PUBLIC_*)
      - key: NEXT_PUBLIC_API_URL
        sync: false
