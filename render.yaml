# Render Blueprint — Devine Adventure (FREE TIER)
#
# - API: free Web Service (NestJS) — sleeps after idle
# - Web: free Static Site (Next export) — no Node, no sleep
# - DB:  Supabase free Postgres
#
# Deploy: New → Blueprint → this repo → main

services:
  # ── NestJS API (free web service) ────────────────────────
  - type: web
    name: devine-adventure-api
    runtime: node
    plan: free
    region: oregon
    rootDir: devine-adventure-api
    buildCommand: npm ci && npm run build
    # Sets DIRECT_URL from DATABASE_URL when unset (avoids P1012 on free-tier deploys)
    startCommand: npm run release
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      # Static site URL, e.g. https://devine-adventure-web.onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MAILCHIMP_API_KEY
        sync: false
      - key: MAILCHIMP_SERVER_PREFIX
        sync: false
      - key: MAILCHIMP_LIST_ID
        sync: false

  # ── Next.js static export (free static site — always on) ─
  - type: web
    name: devine-adventure-web
    runtime: static
    rootDir: devine-adventure-web
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    autoDeploy: true
    envVars:
      # Required at BUILD time (baked into the static JS)
      # e.g. https://devine-adventure-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_API_URL
        sync: false
