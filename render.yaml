# Render Blueprint — Devine Adventure (FREE TIER)
# Docs: https://render.com/docs/blueprint-spec
#
# Free tier notes:
# - Both services spin down after ~15 min idle (first hit can take 30–60s)
# - DB is Supabase free (not Render Postgres)
# - Set DATABASE_URL + DIRECT_URL + NEXT_PUBLIC_API_URL in the dashboard
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo → apply.

services:
  # ── NestJS API ───────────────────────────────────────────
  - type: web
    name: devine-adventure-api
    runtime: node
    plan: free
    region: oregon
    rootDir: devine-adventure-api
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # Supabase pooler URL (port 6543, ?pgbouncer=true) — runtime
      - key: DATABASE_URL
        sync: false
      # Supabase direct URL (port 5432) — prisma migrate
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      # After web is live: https://devine-adventure-web.onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MAILCHIMP_API_KEY
        sync: false
      - key: MAILCHIMP_SERVER_PREFIX
        sync: false
      - key: MAILCHIMP_LIST_ID
        sync: false

  # ── Next.js web ──────────────────────────────────────────
  - type: web
    name: devine-adventure-web
    runtime: node
    plan: free
    region: oregon
    rootDir: devine-adventure-web
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
      # https://devine-adventure-api.onrender.com/api/v1  (required at BUILD time)
      - key: NEXT_PUBLIC_API_URL
        sync: false
